# Static analysis configuration for the validate_kit package.
#
# This uses the `lints` recommended ruleset, which is the baseline used by
# pub.dev when scoring packages, and adds a few stricter rules that keep the
# public API clean and fully documented.
include: package:lints/recommended.yaml

linter:
  rules:
    # Enforce documentation on every public declaration.
    public_member_api_docs: true
    # Prefer const constructors and declarations where possible.
    prefer_const_constructors: true
    prefer_const_declarations: true
    # Avoid relative imports that escape the package's lib/ directory.
    avoid_relative_lib_imports: true
    # Keep the API explicit and predictable.
    always_declare_return_types: true
    prefer_final_locals: true
    unawaited_futures: true
    # Named parameters cannot initialize private fields via `this._field`, so
    # this rule only produces false positives for encapsulated builders.
    prefer_initializing_formals: false

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Surface missing documentation as an error so it is never merged.
    public_member_api_docs: warning
    # Treat dead code and unused imports as build-breaking.
    dead_code: error
    unused_import: error
